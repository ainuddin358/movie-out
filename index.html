<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited to Movie Night! 🍿🎬</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --accent-color: #ff3366;
            --accent-hover: #e02855;
            --text-color: #ffffff;
            --subtext-color: #a0a0b0;
            --input-bg: #252535;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a3a;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
        }

        .header img {
            width: 100%;
            max-width: 280px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 1.1rem;
            margin-top: 25px;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 4px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label.field-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: var(--subtext-color);
        }

        input[type="text"], input[type="date"], input[type="time"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: var(--input-bg);
            color: #fff;
            border: 1px solid #3a3a4a;
            font-size: 1rem;
            box-sizing: border-box;
        }

        /* Movie Type Grid */
        .grid-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .card-option {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .card-option img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card-option input[type="radio"] {
            display: none;
        }

        .card-option:has(input:checked) {
            border-color: var(--accent-color);
            background: #322538;
        }

        /* Radio Group for Day / Night */
        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-btn {
            flex: 1;
            background: var(--input-bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .radio-btn input {
            display: none;
        }

        .radio-btn:has(input:checked) {
            border-color: var(--accent-color);
            background: #322538;
        }

        /* Snacks Checklist */
        .checklist {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .check-item {
            background: var(--input-bg);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .check-item input {
            accent-color: var(--accent-color);
            width: 18px;
            height: 18px;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        #confirmation-message {
            display: none;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="invitation-form">
        <!-- Hero Section -->
        <div class="header">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3p0eGNxbnI2eXBreGk1ZTRqbnEzdW9hc3E4OHBibXNzaHZxOHptYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l378bu6ZYfQ5nZ2V2/giphy.gif" alt="Popcorn GIF">
            <h1>Invited to a Movie Night! 🍿🎬</h1>
            <p style="color: var(--subtext-color);">Help me plan our ultimate movie date.</p>
        </div>

        <form id="movieForm">
            
            <!-- Web3Forms Access Key Hidden Field -->
            <input type="hidden" name="access_key" value="2305fdfc-ac87-41be-99a9-bc5584b78203">
            <input type="hidden" name="subject" value="New Movie Date RSVP Received! 🍿">

            <!-- 1. Movie Type -->
            <div class="section-title">1. Movie Type (Genre)</div>
            <div class="grid-options">
                <label class="card-option">
                    <input type="radio" name="Movie Genre" value="Comedy" required>
                    <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=400" alt="Comedy">
                    <p><strong>Comedy 🎭</strong></p>
                </label>
                <label class="card-option">
                    <input type="radio" name="Movie Genre" value="Horror">
                    <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400" alt="Horror">
                    <p><strong>Horror 👻</strong></p>
                </label>
                <label class="card-option">
                    <input type="radio" name="Movie Genre" value="Romantic">
                    <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400" alt="Romance">
                    <p><strong>Romance 💕</strong></p>
                </label>
                <label class="card-option">
                    <input type="radio" name="Movie Genre" value="Action / Sci-Fi">
                    <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400" alt="Action">
                    <p><strong>Action 🚀</strong></p>
                </label>
            </div>

            <!-- 2. Movie Name -->
            <div class="section-title">2. Movie Name</div>
            <div class="form-group">
                <label class="field-label">Which movie would you like to watch?</label>
                <input type="text" name="Movie Name" placeholder="e.g. Inception, Stree 2, Avatar..." required>
            </div>

            <!-- 3. Day or Night -->
            <div class="section-title">3. Day or Night Show?</div>
            <div class="radio-group">
                <label class="radio-btn">
                    <input type="radio" name="Show Timing" value="Day Show ☀️" required>
                    ☀️ Day Show
                </label>
                <label class="radio-btn">
                    <input type="radio" name="Show Timing" value="Night Show 🌙">
                    🌙 Night Show
                </label>
            </div>

            <!-- 4. Date & Time -->
            <div class="section-title">4. Date & Time</div>
            <div class="form-group">
                <label class="field-label">Select Date:</label>
                <input type="date" name="Preferred Date" required>
            </div>
            <div class="form-group">
                <label class="field-label">Select Time:</label>
                <input type="time" name="Preferred Time" required>
            </div>

            <!-- 5. Snacks Checklist -->
            <div class="section-title">5. Snack List 🍿</div>
            <div class="checklist">
                <label class="check-item">
                    <input type="checkbox" class="snack-check" name="Snack: Popcorn" value="Yes"> Popcorn 🍿
                </label>
                <label class="check-item">
                    <input type="checkbox" class="snack-check" name="Snack: Nachos" value="Yes"> Nachos 🧀
                </label>
                <label class="check-item">
                    <input type="checkbox" class="snack-check" name="Snack: Drinks" value="Yes"> Drinks 🥤
                </label>
                <label class="check-item">
                    <input type="checkbox" class="snack-check" name="Snack: Candy" value="Yes"> Candy 🍬
                </label>
                <label class="check-item" style="grid-column: span 2; background: #382525;">
                    <input type="checkbox" id="skipSnacks" name="Skip Snacks" value="Yes"> Skip Snacks ❌
                </label>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Confirm & Send RSVP! ✨</button>
        </form>
    </div>

    <!-- Confirmation Success Screen -->
    <div id="confirmation-message">
        <img src="https://media.giphy.com/media/26tknCqiYwe7Xmjw4/giphy.gif" alt="Celebration" style="width: 100%; border-radius: 12px; margin-bottom: 15px;">
        <h2>It's a Date! 🎉</h2>
        <p style="color: var(--subtext-color);">Your choices have been sent successfully. Get ready for a great movie night!</p>
    </div>
</div>

<script>
    // Handle Skip Snacks option logic
    const skipCheckbox = document.getElementById('skipSnacks');
    const snackCheckboxes = document.querySelectorAll('.snack-check');

    skipCheckbox.addEventListener('change', function() {
        if (this.checked) {
            snackCheckboxes.forEach(cb => {
                cb.checked = false;
                cb.disabled = true;
            });
        } else {
            snackCheckboxes.forEach(cb => {
                cb.disabled = false;
            });
        }
    });

    snackCheckboxes.forEach(cb => {
        cb.addEventListener('change', function() {
            if (this.checked) {
                skipCheckbox.checked = false;
            }
        });
    });

    // Form submission directly to Web3Forms API
    const form = document.getElementById('movieForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Update button status
        submitBtn.textContent = "Sending...";
        submitBtn.disabled = true;

        // Launch Confetti
        confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 }
        });

        // Submit to Web3Forms API
        const formData = new FormData(form);

        try {
            const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                // Show Success Screen on Website
                document.getElementById('invitation-form').style.display = 'none';
                document.getElementById('confirmation-message').style.display = 'block';
            } else {
                alert("Something went wrong. Please try again.");
                submitBtn.textContent = "Confirm & Send RSVP! ✨";
                submitBtn.disabled = false;
            }
        } catch (error) {
            alert("Network error. Please try again.");
            submitBtn.textContent = "Confirm & Send RSVP! ✨";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
